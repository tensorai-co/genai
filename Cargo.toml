[workspace]
members = ["crates/genai", "crates/genai-core", "crates/genai-anthropic", "crates/genai-google", "crates/genai-openai"]
default-members = ["crates/genai"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tensorai-co/genai"
homepage = "https://github.com/tensorai-co/genai"
rust-version = "1.88"

[workspace.dependencies]
genai-core = { path = "crates/genai-core", version = "0.1.0" }
genai-anthropic = { path = "crates/genai-anthropic", version = "0.1.0" }
genai-google = { path = "crates/genai-google", version = "0.1.0" }
genai-openai = { path = "crates/genai-openai", version = "0.1.0" }
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2", "system-proxy"] }
schemars = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
